clusters:
  - id: cdf
    display_name: CDF NiFi
    product: nifi
    context: cdf01-1-8
    kubeconfig: kubeconfigs/cdf.yaml
    awc_engine_id: cdf
    collectors:
      - nifi_metrics
      - nifi_logs
    # Optional Knox HTTPS fallback scrape (requires secrets/knox.jwt from KNOX_JWT in .env)
    # knox_metrics_url: https://cdf.example.com/gateway/cdf/dfx-nifi/metrics/prometheus
    knox_metrics_url: ""

